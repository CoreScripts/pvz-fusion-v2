<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="utf-8">
        <title>Plants Vs Zombies Hybrids</title>
        <style>
            body {
                margin: 0;
                padding: 0;
                overflow: hidden;
                background: #1a1a1a;
            }
            #unity-canvas {
                width: 100%;
                height: 100vh;
                display: block;
            }
        </style>
    </head>
    <body>
        <canvas id="unity-canvas"></canvas>
        
        <script>
            var canvas = document.getElementById('unity-canvas');
            
            var config = {
                dataUrl: "Build/PvzFM.data.unityweb",
                frameworkUrl: "Build/PvzFM.framework.js.unityweb", 
                codeUrl: "Build/PvzFM.wasm.unityweb",
                streamingAssetsUrl: "StreamingAssets",
                companyName: "DefaultCompany",
                productName: "PlantsVsZombies"
            };
            
            function launchGame() {
                if (typeof createUnityInstance === 'undefined') {
                    console.log("Waiting for Unity loader...");
                    setTimeout(launchGame, 100);
                    return;
                }
                
                console.log("Launching game...");
                createUnityInstance(canvas, config, function(progress) {
                    console.log(Math.round(progress * 100) + '%');
                }).then(function(instance) {
                    console.log('Game ready!');
                    window.gameInstance = instance;
                }).catch(function(err) {
                    console.error('Game error:', err);
                });
            }
            
            launchGame();
        </script>
        
        <!-- Load order matters: loader.js first, then framework -->
        <script src="Build/PvzFM.loader.js"></script>
        <script src="Build/PvzFM.framework.js.unityweb"></script>
    </body>
</html>
