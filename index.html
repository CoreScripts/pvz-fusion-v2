<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <title>Plants Vs Zombies Hybrids</title>
        <link rel="preconnect" href="https://bridge.playgama.com">
        <style>
            html, body {
                width: 100%;
                height: 100%;
                padding: 0px;
                margin: 0px;
                overflow: hidden;
            }
            .fullscreen-canvas {
                background: #242424;
                width: 100%;
                height: 100%;
                position: absolute;
                top: 0px;
                left: 0px;
            }
        </style>
    </head>
    <body>
        <canvas id="canvas" class="fullscreen-canvas"></canvas>
        
        <script>
            var canvas = document.getElementById('canvas');
            
            var config = {
                dataUrl: "cmpe6ltov004an30htbub9kl7/Build/PvzFM.data.unityweb",
                frameworkUrl: "cmpe6ltov004an30htbub9kl7/Build/PvzFM.framework.js.unityweb",
                codeUrl: "cmpe6ltov004an30htbub9kl7/Build/PvzFM.wasm.unityweb",
                streamingAssetsUrl: "cmpe6ltov004an30htbub9kl7/StreamingAssets"
            };
            
            function launch() {
                if (typeof createUnityInstance !== 'undefined') {
                    createUnityInstance(canvas, config, function(progress) {
                        console.log((progress * 100).toFixed(1) + '%');
                    }).then(function(instance) {
                        console.log('Game ready!');
                    }).catch(function(err) {
                        console.error('Game error:', err);
                    });
                } else {
                    setTimeout(launch, 100);
                }
            }
            
            launch();
        </script>
        
        <script src="cmpe6ltov004an30htbub9kl7/Build/PvzFM.loader.js"></script>
        <script src="cmpe6ltov004an30htbub9kl7/Build/PvzFM.framework.js.unityweb"></script>
        <script src="cmpe6ltov004an30htbub9kl7/playgama-bridge-unity.js"></script>
    </body>
</html>
